<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Receptionist Setup</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M11 9c-1 0-2 1-2 2 0 7 5 12 12 12 1 0 2-1 2-2v-2l-4-2-2 2c-2-1-3-2-4-4l2-2-2-4z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
      </div>
      <div class="top-title"><span id="brand-name">Receptionist</span> <span class="muted">Setup</span></div>
      <div id="mock-badge" class="badge-test" hidden>Test mode</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  </header>

  <div class="layout">
    <nav class="steps" id="steps" aria-label="Setup steps"></nav>
    <main class="card" id="main" aria-live="polite">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <footer class="foot">Everything you type stays on this computer until it's sent to your own server.</footer>

  <dialog id="confirm">
    <form method="dialog">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text"></p>
      <div class="row end">
        <button value="no" class="btn ghost">Cancel</button>
        <button value="yes" class="btn danger" id="confirm-yes">Yes</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
