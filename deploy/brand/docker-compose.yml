# One separately branded copy of the app (template). remote-deploy.sh replaces
# __BRAND__ with the copy's slug and writes the result to /opt/brands/<brand>/.
# Runs next to the main Twin stack on the same server, with its own container,
# database (<brand>) and address. The main Caddy reaches it over the main
# stack's network as <brand>-app:8791.
name: __BRAND__
services:
  app:
    build: { context: ./src, dockerfile: deploy/Dockerfile }
    image: __BRAND__-app:latest
    container_name: __BRAND__-app
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      API_PORT: "8791"
    volumes:
      - app-data:/app/data
      - /opt/twin/rds-ca.pem:/etc/ssl/rds-ca.pem:ro
    networks: [twin]
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

networks:
  twin:
    external: true
    name: twin_default

volumes:
  app-data:
