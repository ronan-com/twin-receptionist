# Self-hosted stack: app + its own Postgres + Caddy (automatic https).
# Run it through ./dc.sh (or install.sh), which passes the generated run/compose.env.
# Only Caddy publishes ports (80, 443). Postgres and the app are reachable only
# inside the stack's private network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: receptionist
      POSTGRES_DB: receptionist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run install.sh first}
    volumes:
      - db-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receptionist -d receptionist"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  app:
    build: { context: ./app, dockerfile: deploy/Dockerfile }
    image: ${APP_IMAGE:-receptionist-app}:latest
    restart: unless-stopped
    env_file: [run/app.env]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - app-data:/app/data
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?run install.sh first}
      CADDY_TLS: ${CADDY_TLS:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
